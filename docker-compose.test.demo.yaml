services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      - CADDY_INGRESS_NETWORKS=web
    labels:
      caddy.local_certs: true
    networks:
      - web

  database:
    image: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: ufgouifdgjdfg
      POSTGRES_DB: petboarding
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      demo:
        aliases:
          - database

  mailhog:
    image: mailhog/mailhog:latest
    logging:
      driver: 'none'
    ports:
      - '8025:8025'
      - '1025:1025'
    networks:
      demo:
        aliases:
          - mailhog

  app:
    build:
      context: .
      args:
        DEBUG: 'true'
      secrets:
        - SIMSUSTECH_NPM_TOKEN
      dockerfile: Dockerfile
      target: api
      network: 'host'
      additional_contexts:
        linked-quasar-components: ${LINKED_QUASAR_COMPONENTS_PATH:-.docker/empty}
        linked-vitrify: .docker/empty
        linked-unocss-preset-quasar: ${LINKED_UNOCSS_PRESET_QUASAR_PATH:-.docker/empty}
        linked-modular-api: .docker/empty
        linked-modular-api-api: .docker/empty
        linked-modular-api-fastify-oidc: .docker/empty
        linked-modular-api-fastify-checkout: .docker/empty
        linked-modular-api-quasar-components: .docker/empty
    depends_on:
      database:
        condition: service_healthy
    labels:
      caddy: petboarding.localhost
      caddy.reverse_proxy: '{{upstreams 80}}'
      caddy.encode: zstd gzip
    environment:
      VITE_API_HOST: petboarding.localhost
      VITE_LICENSE_KEY: undefined
      VITE_TITLE: Petboarding
      VITE_SOURCE_COLOR: '#4EBDC2'
      VITE_SASS_VARIABLE_PRIMARY: '#4EBDC2'
      VITE_SASS_VARIABLE_SECONDARY: '#237175'
      VITE_SASS_VARIABLE_ACCENT: '#C2AF3A'
      POSTGRES_HOST: database
      POSTGRES_DB: petboarding
      POSTGRES_PASSWORD: ufgouifdgjdfg
      MAIL_HOST: mailhog
      MAIL_PORT: '1025'
      MAIL_FROM: 'test@petboarding.app'
      MAIL_SECURE: 'false'
      OIDC_COOKIES_KEYS: 7JOoAPoC5232uJiUdDd+7EUuyFFcZqQJwsAQDnoldZI=
      OTP_SECRET: NNXHQ5TPNF2WK53POJUWU53MMVXHE===
      OTP_VALIDITY_SECONDS: 3600
      EMAIL_FOOTER: 'Petboarding <info@petboarding.app>'
    command:
      [
        'sh',
        '-c',
        'npm run migrate:latest && npm run seed:fake && npm run start'
      ]
    healthcheck:
      test: curl --fail --insecure http://localhost || exit 1
      interval: 10s
      retries: 10
      start_period: 15s
      timeout: 10s
    networks:
      demo:
      web:

secrets:
  SIMSUSTECH_NPM_TOKEN:
    environment: 'SIMSUSTECH_NPM_TOKEN'

networks:
  demo:
  web:
    external: true
